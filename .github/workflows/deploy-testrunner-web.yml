name: Deploy TestRunner.Web

on:
  push:
    branches: [main]
    paths:
      - 'GwuxDesign.PRAT/TestRunner.Web/**'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        working-directory: GwuxDesign.PRAT/TestRunner.Web
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: gwuxdesign-testrunner
          publish-profile: ${{ secrets.AZURE_TESTRUNNER_PUBLISH_PROFILE }}
          package: GwuxDesign.PRAT/TestRunner.Web/publish
