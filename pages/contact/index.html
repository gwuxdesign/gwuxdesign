<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact | GW UX Design</title>
    <meta name="description" content="Get in touch." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme) document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <a
      href="#content"
      class="skip"
      style="
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      "
    >
      Skip to content
    </a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img src="/assets/img/logo.svg" alt="GW UX Design logo" />
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav class="nav" id="primary-nav">
          <a href="/">Home</a>
          <!-- <a href="/pages/blog/">Blog</a> -->
          <a href="/pages/profile/">Profile</a>
          <a href="/pages/projects/">Projects</a>
          <a href="/pages/contact/" aria-current="page">Contact</a>

          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle colour theme"
            aria-pressed="false"
          >
            <span class="theme-icon" aria-hidden="true">☀</span>
            <span class="theme-switch" aria-hidden="true">
              <span class="theme-thumb"></span>
            </span>
            <span class="theme-icon" aria-hidden="true">☾</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="content">
      <div class="container">
        <section class="card contact">
          <h1>Contact</h1>
          <p>Have a question or want to work together? Drop me a message below.</p>

          <form id="contact-form" class="contact-form" novalidate>
            <div class="form-field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
              <span class="form-error" data-error-for="name"></span>
            </div>

            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
              <span class="form-error" data-error-for="email"></span>
            </div>

            <div class="form-field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>
              <span class="form-error" data-error-for="message"></span>
            </div>

            <div class="cf-turnstile" data-sitekey="0x4AAAAAAELPANTJwSI2X6kO"></div>

            <button type="submit" class="button-primary">Send message</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>

          <div id="contact-confirmation" class="contact-confirmation" hidden>
            <h2>Message sent</h2>
            <p>Thanks for getting in touch, I'll get back to you as soon as I can.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> GW UX Design</p>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/contact.js"></script>
  </body>
</html>
